

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Sinuca - Salão de Bilhar</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(ellipse at center, #2a0d10 0%, #140608 60%, #0a0304 100%);
            color: #d4b876;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
        }

        /* ============ TELA INICIAL ============ */
        #inicio {
            text-align: center;
            max-width: 700px;
            width: 100%;
            animation: fadeIn 1s ease;
        }

        .topo {
            font-size: 13px;
            letter-spacing: 6px;
            color: #8a6f3c;
            margin-bottom: 25px;
        }

        .topo::before,
        .topo::after {
            content: "◆";
            margin: 0 12px;
            font-size: 8px;
            vertical-align: middle;
            color: #8a6f3c;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 88px;
            font-weight: 700;
            letter-spacing: 14px;
            background: linear-gradient(180deg, #e8d194 0%, #c9a961 50%, #7a5c1f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 60px rgba(201, 169, 97, 0.25);
            margin-bottom: 15px;
        }

        .subtitulo {
            font-size: 12px;
            letter-spacing: 8px;
            color: #a08548;
            margin-bottom: 35px;
        }

        .divisor {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 30px;
        }

        .divisor::before,
        .divisor::after {
            content: "";
            height: 1px;
            width: 180px;
            background: linear-gradient(90deg, transparent, #8a6f3c, transparent);
        }

        .divisor span {
            color: #c9a961;
            font-size: 10px;
        }

        .bolinhas-deco {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 45px;
        }

        .bolinhas-deco div {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            box-shadow: 0 0 14px currentColor;
        }

        .c1 {
            background: #c9a961;
            color: #c9a961
        }

        .c2 {
            background: #8b1a2b;
            color: #8b1a2b
        }

        .c3 {
            background: #e8dcc4;
            color: #e8dcc4
        }

        .c4 {
            background: #4a1020;
            color: #4a1020
        }

        .c5 {
            background: #e8c87a;
            color: #e8c87a
        }

        .botoes-menu {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .botao-menu {
            background: transparent;
            border: 1px solid #8a6f3c;
            color: #d4b876;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            letter-spacing: 4px;
            padding: 18px 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 220px;
        }

        .botao-menu:hover {
            background: rgba(201, 169, 97, 0.08);
            border-color: #c9a961;
            color: #e8d194;
            box-shadow: 0 0 25px rgba(201, 169, 97, 0.2);
        }

        #areaNomes {
            display: none;
            margin-top: 40px;
            animation: fadeIn 0.6s ease;
        }

        #areaNomes .linha-nomes {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .campo-nome {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .campo-nome label {
            font-size: 10px;
            letter-spacing: 4px;
            color: #8a6f3c;
        }

        .campo-nome input {
            background: transparent;
            border: none;
            border-bottom: 1px solid #8a6f3c;
            color: #e8d194;
            font-family: 'Cinzel', serif;
            font-size: 18px;
            letter-spacing: 2px;
            text-align: center;
            padding: 8px 12px;
            width: 220px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .campo-nome input:focus {
            border-bottom-color: #c9a961;
            box-shadow: 0 6px 12px -8px rgba(201, 169, 97, 0.6);
        }

        .campo-nome input::placeholder {
            color: #5a4520;
            font-size: 12px;
            letter-spacing: 3px;
        }

        /* ============ TELA DO JOGO ============ */
        #jogo {
            display: none;
            width: 100%;
            max-width: 980px;
            margin: 0 auto;
            animation: fadeIn 0.6s ease;
        }

        .jogo-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .jogo-header h2 {
            font-family: 'Cinzel', serif;
            font-size: 30px;
            letter-spacing: 12px;
            font-weight: 600;
            background: linear-gradient(180deg, #e8d194, #c9a961);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== PLACAR ===== */
        .placar-topo {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 16px;
        }

        .placar-card {
            background: rgba(20, 6, 8, 0.9);
            border: 1px solid #5a4520;
            border-radius: 4px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            height: 84px;
            transition: all 0.4s;
        }

        .placar-card.ativo {
            border-color: #c9a961;
            box-shadow: 0 0 25px rgba(201, 169, 97, 0.35), inset 0 0 25px rgba(201, 169, 97, 0.06);
        }

        .placar-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
            flex: 1;
            overflow: hidden;
        }

        .placar-nome {
            font-family: 'Cinzel', serif;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 4px;
            color: #e8d194;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .placar-pontos-linha {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .placar-pontos-linha .label {
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            letter-spacing: 4px;
            color: #8a6f3c;
        }

        .placar-pontos-linha .valor {
            font-family: 'Cinzel', serif;
            font-size: 26px;
            font-weight: 700;
            color: #c9a961;
            line-height: 1;
        }

        .placar-bolas {
            display: grid;
            grid-template-columns: repeat(4, 24px);
            grid-auto-rows: 24px;
            gap: 6px;
            justify-content: end;
            align-content: center;
        }

        .bola-mini {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 10px;
            color: #fff;
            box-shadow: inset -2px -2px 3px rgba(0, 0, 0, 0.55), 0 1px 3px rgba(0, 0, 0, 0.5);
            transition: all 0.3s;
            position: relative;
        }

        .bola-mini.morta {
            opacity: 0.15;
            filter: grayscale(1);
        }

        .bola-mini.morta::after {
            content: "";
            position: absolute;
            width: 130%;
            height: 1.5px;
            background: #e8d194;
            transform: rotate(-45deg);
            top: 50%;
            left: -15%;
            box-shadow: 0 0 4px #000;
        }

        .bola-mini.vazio {
            background: transparent;
            border: 1px dashed #3a2a15;
            box-shadow: none;
        }

        .b1 {
            background: #f5c400;
            color: #000
        }

        .b2 {
            background: #0a3d91
        }

        .b3 {
            background: #c81414
        }

        .b4 {
            background: #5a2d82
        }

        .b5 {
            background: #ff7700
        }

        .b6 {
            background: #008a3e
        }

        .b7 {
            background: #7a1e1e
        }

        .b8 {
            background: #111;
            border: 1px solid #444
        }

        .b9 {
            background: #f5c400;
            color: #000
        }

        .b10 {
            background: #0a3d91
        }

        .b11 {
            background: #c81414
        }

        .b12 {
            background: #5a2d82
        }

        .b13 {
            background: #ff7700
        }

        .b14 {
            background: #008a3e
        }

        .b15 {
            background: #7a1e1e
        }

        /* ===== MESA ===== */
        .mesa-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        #mesa {
            background: radial-gradient(ellipse at center, #1a3d24 0%, #0d2a17 70%, #061509 100%);
            border: 16px solid #3a1a0e;
            border-radius: 14px;
            box-shadow:
                0 0 0 3px #7a5c1f,
                0 0 50px rgba(0, 0, 0, 0.85),
                inset 0 0 80px rgba(0, 0, 0, 0.65);
            cursor: crosshair;
            display: block;
            width: 100%;
            max-width: 820px;
            height: auto;
            aspect-ratio: 820 / 440;
            touch-action: none;
        }

        .mensagem {
            text-align: center;
            font-family: 'Cinzel', serif;
            letter-spacing: 3px;
            font-size: 14px;
            color: #e8d194;
            height: 24px;
            margin-top: 18px;
            transition: opacity 0.3s;
        }

        .mensagem.aviso {
            color: #e8a0a0;
        }

        .mensagem.ok {
            color: #7CFC00;
        }

        .mensagem.destaque {
            color: #ffd700;
            font-size: 16px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }
        }

        .rodape-jogo {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn-acao {
            background: transparent;
            border: 1px solid #8a6f3c;
            color: #d4b876;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            letter-spacing: 3px;
            padding: 12px 26px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-acao:hover {
            background: rgba(201, 169, 97, 0.1);
            color: #e8d194;
            border-color: #c9a961;
        }

        .btn-acao.vermelho:hover {
            background: rgba(139, 26, 43, 0.25);
            border-color: #8b1a2b;
            color: #e8a0a0;
        }

        /* ===== TELA FINAL ===== */
        #telaFinal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 3, 4, 0.92);
            backdrop-filter: blur(6px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 30px;
            animation: fadeIn 0.6s ease;
        }

        #telaFinal.ativo {
            display: flex;
        }

        .final-box {
            max-width: 620px;
            width: 100%;
            background: rgba(20, 6, 8, 0.95);
            border: 1px solid #c9a961;
            border-radius: 6px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 0 60px rgba(201, 169, 97, 0.35);
        }

        .final-coroa {
            font-size: 46px;
            margin-bottom: 15px;
            animation: pulse 1.5s infinite;
        }

        .final-titulo {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            letter-spacing: 8px;
            color: #8a6f3c;
            margin-bottom: 12px;
        }

        .final-vencedor {
            font-family: 'Cinzel', serif;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 6px;
            background: linear-gradient(180deg, #ffd700, #c9a961 60%, #7a5c1f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .final-divisor {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin: 30px 0;
            color: #8a6f3c;
            font-size: 10px;
        }

        .final-divisor::before,
        .final-divisor::after {
            content: "";
            height: 1px;
            width: 100px;
            background: linear-gradient(90deg, transparent, #8a6f3c, transparent);
        }

        .final-placar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .final-jogador {
            min-width: 160px;
            padding: 16px 22px;
            border: 1px solid #3a2a15;
            border-radius: 4px;
            transition: all 0.4s;
        }

        .final-jogador.ganhador {
            border-color: #c9a961;
            box-shadow: 0 0 25px rgba(201, 169, 97, 0.35);
            background: rgba(201, 169, 97, 0.04);
        }

        .final-jogador .nome {
            font-family: 'Cinzel', serif;
            font-size: 13px;
            letter-spacing: 4px;
            color: #e8d194;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .final-jogador .pontos {
            font-family: 'Cinzel', serif;
            font-size: 32px;
            font-weight: 700;
            color: #c9a961;
            line-height: 1;
        }

        .final-jogador .legenda {
            font-size: 9px;
            letter-spacing: 4px;
            color: #8a6f3c;
            margin-top: 6px;
        }

        .final-botoes {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <!-- ==================== TELA INICIAL ==================== -->
    <div id="inicio">
        <div class="topo">CLUBE PRIVADO</div>
        <h1>SINUCA</h1>
        <div class="subtitulo">SALÃO DE BILHAR</div>
        <div class="divisor"><span>◆</span></div>
        <div class="bolinhas-deco">
            <div class="c1"></div>
            <div class="c2"></div>
            <div class="c3"></div>
            <div class="c4"></div>
            <div class="c5"></div>
        </div>

        <div class="botoes-menu">
            <button class="botao-menu" onclick="abrirNomes(1)">1 JOGADOR</button>
            <button class="botao-menu" onclick="abrirNomes(2)">2 JOGADORES</button>
        </div>

        <div id="areaNomes">
            <div class="linha-nomes" id="linhaNomes"></div>
            <button class="botao-menu" onclick="comecarPartida()">COMEÇAR PARTIDA</button>
        </div>
    </div>

    <!-- ==================== TELA DO JOGO ==================== -->
    <div id="jogo">
        <div class="jogo-header">
            <h2 id="tituloMesa">MESA ABERTA</h2>
        </div>

        <div class="placar-topo" id="placarTopo"></div>

        <div class="mesa-wrapper">
            <canvas id="mesa" width="820" height="440"></canvas>
        </div>

        <div class="mensagem" id="mensagem"></div>

        <div class="rodape-jogo">
            <button class="btn-acao" onclick="passarVez()">PASSAR A VEZ</button>
            <button class="btn-acao" onclick="novaPartida()">NOVA PARTIDA</button>
            <button class="btn-acao vermelho" onclick="voltarMenu()">← VOLTAR AO MENU</button>
        </div>
    </div>

    <!-- ==================== TELA FINAL ==================== -->
    <div id="telaFinal">
        <div class="final-box">
            <div class="final-coroa">🏆</div>
            <div class="final-titulo">VENCEDOR DA PARTIDA</div>
            <div class="final-vencedor" id="finalVencedor">—</div>

            <div class="final-divisor">◆</div>

            <div class="final-placar" id="finalPlacar"></div>

            <div class="final-botoes">
                <button class="btn-acao" onclick="novaPartida()">NOVA PARTIDA</button>
                <button class="btn-acao vermelho" onclick="voltarMenu()">← VOLTAR AO MENU</button>
            </div>
        </div>
    </div>

    <script>
        // ==================================================
        //   CONFIGURAÇÃO
        // ==================================================
        const RAIO_BOLA = 11;
        const CANVAS_W = 820;
        const CANVAS_H = 440;
        const CAÇAPA_RAIO = 20;
        const ATRITO = 0.99;
        const VEL_MIN = 0.08;

        const CORES = {
            1: '#f5c400', 2: '#0a3d91', 3: '#c81414', 4: '#5a2d82', 5: '#ff7700',
            6: '#008a3e', 7: '#7a1e1e', 8: '#111111',
            9: '#f5c400', 10: '#0a3d91', 11: '#c81414', 12: '#5a2d82',
            13: '#ff7700', 14: '#008a3e', 15: '#7a1e1e'
        };

        const GRUPO_LISO = [1, 2, 3, 4, 5, 6, 7];
        const GRUPO_LISTRADO = [9, 10, 11, 12, 13, 14, 15];

        const canvas = document.getElementById('mesa');
        const ctx = canvas.getContext('2d');

        let bolas = [];
        let jogadores = [];
        let qtdJogadores = 2;
        let jogadorAtual = 0;
        let estadoTacada = 'parado'; // 'parado' | 'mirando' | 'rodando'
        let mouseX = 0, mouseY = 0;
        let bolaBrancaOriginal = null;
        let travado = false;

        let fase = 'sorteio';
        let jaBateuSorteio = [];
        let primeiraColisaoSorteio = null;

        // Trava anti-duplo-clique
        let ultimaTacadaTempo = 0;

        // ==================================================
        //   BOLAS
        // ==================================================
        function criarBolas() {
            bolas = [];
            bolas.push({
                numero: 0,
                x: CANVAS_W * 0.25,
                y: CANVAS_H / 2,
                vx: 0, vy: 0,
                cor: '#f5f0e6',
                ehBranca: true,
                ativa: true
            });

            const ordem = [1, 9, 2, 10, 8, 3, 11, 4, 12, 5, 13, 6, 14, 7, 15];
            const cx = CANVAS_W * 0.62;
            const cy = CANVAS_H / 2;
            const esp = RAIO_BOLA * 2 + 0.6;
            let idx = 0;

            for (let linha = 0; linha < 5; linha++) {
                for (let col = 0; col <= linha; col++) {
                    const x = cx + linha * esp * 0.87;
                    const y = cy + (col - linha / 2) * esp;
                    const num = ordem[idx++];
                    bolas.push({
                        numero: num, x, y, vx: 0, vy: 0,
                        cor: CORES[num], ehBranca: false, ativa: true
                    });
                }
            }

            bolaBrancaOriginal = { x: CANVAS_W * 0.25, y: CANVAS_H / 2 };
        }

        // ==================================================
        //   INICIAR
        // ==================================================
        function abrirNomes(qtd) {
            qtdJogadores = qtd;
            const linha = document.getElementById("linhaNomes");
            linha.innerHTML = "";
            for (let i = 0; i < qtd; i++) {
                const div = document.createElement("div");
                div.className = "campo-nome";
                div.innerHTML = `
      <label>JOGADOR ${i + 1}</label>
      <input type="text" id="nome${i}" maxlength="14" placeholder="DIGITE O NOME" autocomplete="off">
    `;
                linha.appendChild(div);
            }
            document.getElementById("areaNomes").style.display = "block";
            setTimeout(() => document.getElementById("nome0").focus(), 100);
        }

        function comecarPartida() {
            jogadores = [];
            for (let i = 0; i < qtdJogadores; i++) {
                const inp = document.getElementById("nome" + i);
                const nome = inp.value.trim();
                jogadores.push({
                    nome: nome !== "" ? nome.toUpperCase() : `JOGADOR ${i + 1}`,
                    grupo: null,
                    bolas: [],
                    mortas: [],
                    pontos: 0
                });
            }

            jogadorAtual = 0;
            fase = 'sorteio';
            jaBateuSorteio = [];
            primeiraColisaoSorteio = null;
            criarBolas();
            estadoTacada = 'parado';
            travado = false;

            document.getElementById("telaFinal").classList.remove("ativo");
            document.getElementById("inicio").style.display = "none";
            document.getElementById("jogo").style.display = "block";
            document.getElementById("tituloMesa").textContent = "SORTEIO DE BOLAS";
            atualizarPlacar();
            mostrarMensagem(`🎱 ${jogadores[jogadorAtual].nome}, dê a tacada de abertura!`, 'destaque');
        }

        function novaPartida() {
            jogadores.forEach(j => {
                j.grupo = null;
                j.bolas = [];
                j.mortas = [];
                j.pontos = 0;
            });
            jogadorAtual = 0;
            fase = 'sorteio';
            jaBateuSorteio = [];
            primeiraColisaoSorteio = null;
            criarBolas();
            estadoTacada = 'parado';
            travado = false;
            document.getElementById("telaFinal").classList.remove("ativo");
            document.getElementById("tituloMesa").textContent = "SORTEIO DE BOLAS";
            atualizarPlacar();
            mostrarMensagem(`🎱 ${jogadores[jogadorAtual].nome}, dê a tacada de abertura!`, 'destaque');
        }

        function voltarMenu() {
            document.getElementById("jogo").style.display = "none";
            document.getElementById("inicio").style.display = "block";
            document.getElementById("areaNomes").style.display = "none";
            document.getElementById("telaFinal").classList.remove("ativo");
            document.getElementById("mensagem").textContent = "";
        }

        function passarVez() {
            if (estadoTacada === 'rodando') return;
            if (fase === 'sorteio') {
                mostrarMensagem('Termine o sorteio primeiro!', 'aviso');
                return;
            }
            if (fase === 'fim') return;
            jogadorAtual = (jogadorAtual + 1) % jogadores.length;
            atualizarPlacar();
            mostrarMensagem(`Vez de ${jogadores[jogadorAtual].nome}`);
        }

        // ==================================================
        //   DESENHO
        // ==================================================
        function desenhar() {
            ctx.fillStyle = '#0d2a17';
            ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

            const cacapas = [
                [CAÇAPA_RAIO, CAÇAPA_RAIO],
                [CANVAS_W / 2, CAÇAPA_RAIO - 4],
                [CANVAS_W - CAÇAPA_RAIO, CAÇAPA_RAIO],
                [CAÇAPA_RAIO, CANVAS_H - CAÇAPA_RAIO],
                [CANVAS_W / 2, CANVAS_H - CAÇAPA_RAIO + 4],
                [CANVAS_W - CAÇAPA_RAIO, CANVAS_H - CAÇAPA_RAIO]
            ];
            cacapas.forEach(([cx, cy]) => {
                const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, CAÇAPA_RAIO);
                g.addColorStop(0, '#000');
                g.addColorStop(1, '#1a0a05');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(cx, cy, CAÇAPA_RAIO, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.strokeStyle = 'rgba(232,209,148,0.08)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(CANVAS_W * 0.25, 0);
            ctx.lineTo(CANVAS_W * 0.25, CANVAS_H);
            ctx.stroke();

            bolas.forEach(b => {
                if (!b.ativa) return;

                if (fase === 'sorteio') {
                    const pulse = 0.15 + Math.sin(Date.now() / 300) * 0.1;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, RAIO_BOLA + 5, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,215,0,${pulse})`;
                    ctx.fill();
                }

                ctx.beginPath();
                ctx.arc(b.x + 2, b.y + 3, RAIO_BOLA, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.45)';
                ctx.fill();

                const g = ctx.createRadialGradient(
                    b.x - RAIO_BOLA * 0.35, b.y - RAIO_BOLA * 0.35, 1,
                    b.x, b.y, RAIO_BOLA
                );
                g.addColorStop(0, clarear(b.cor, 60));
                g.addColorStop(0.7, b.cor);
                g.addColorStop(1, escurecer(b.cor, 50));
                ctx.beginPath();
                ctx.arc(b.x, b.y, RAIO_BOLA, 0, Math.PI * 2);
                ctx.fillStyle = g;
                ctx.fill();

                if (!b.ehBranca) {
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, RAIO_BOLA * 0.55, 0, Math.PI * 2);
                    ctx.fillStyle = '#f5f0e6';
                    ctx.fill();
                    ctx.fillStyle = '#111';
                    ctx.font = 'bold 10px Montserrat, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(b.numero, b.x, b.y + 0.5);
                }

                ctx.beginPath();
                ctx.arc(b.x - RAIO_BOLA * 0.3, b.y - RAIO_BOLA * 0.35, RAIO_BOLA * 0.25, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.fill();
            });

            if (estadoTacada === 'mirando' && !travado && fase !== 'fim') {
                const branca = bolas.find(b => b.ehBranca && b.ativa);
                if (branca) {
                    const dx = mouseX - branca.x;
                    const dy = mouseY - branca.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist > 0) {
                        const ux = dx / dist, uy = dy / dist;
                        const forca = Math.min(dist / 120, 1);
                        const comprimento = 60 + forca * 120;

                        ctx.save();
                        ctx.setLineDash([6, 6]);
                        ctx.strokeStyle = `rgba(232,209,148,${0.4 + forca * 0.6})`;
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(branca.x, branca.y);
                        ctx.lineTo(branca.x + ux * comprimento, branca.y + uy * comprimento);
                        ctx.stroke();
                        ctx.restore();

                        ctx.beginPath();
                        ctx.arc(branca.x, branca.y, RAIO_BOLA + 6 + forca * 10, 0, Math.PI * 2);
                        ctx.strokeStyle = `rgba(201,169,97,${0.3 + forca * 0.5})`;
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                }
            }
        }

        function clarear(hex, amt) {
            const c = hexParaRgb(hex);
            return `rgb(${Math.min(255, c.r + amt)},${Math.min(255, c.g + amt)},${Math.min(255, c.b + amt)})`;
        }
        function escurecer(hex, amt) {
            const c = hexParaRgb(hex);
            return `rgb(${Math.max(0, c.r - amt)},${Math.max(0, c.g - amt)},${Math.max(0, c.b - amt)})`;
        }
        function hexParaRgb(hex) {
            const h = hex.replace('#', '');
            return {
                r: parseInt(h.substring(0, 2), 16),
                g: parseInt(h.substring(2, 4), 16),
                b: parseInt(h.substring(4, 6), 16)
            };
        }

        // ==================================================
        //   FÍSICA
        // ==================================================
        function atualizarFisica() {
            let emMovimento = false;

            bolas.forEach(b => {
                if (!b.ativa) return;
                b.x += b.vx;
                b.y += b.vy;
                b.vx *= ATRITO;
                b.vy *= ATRITO;
                if (Math.abs(b.vx) < VEL_MIN) b.vx = 0;
                if (Math.abs(b.vy) < VEL_MIN) b.vy = 0;
                if (b.vx !== 0 || b.vy !== 0) emMovimento = true;

                if (b.x - RAIO_BOLA < 0) { b.x = RAIO_BOLA; b.vx = -b.vx * 0.85; }
                if (b.x + RAIO_BOLA > CANVAS_W) { b.x = CANVAS_W - RAIO_BOLA; b.vx = -b.vx * 0.85; }
                if (b.y - RAIO_BOLA < 0) { b.y = RAIO_BOLA; b.vy = -b.vy * 0.85; }
                if (b.y + RAIO_BOLA > CANVAS_H) { b.y = CANVAS_H - RAIO_BOLA; b.vy = -b.vy * 0.85; }
            });

            for (let i = 0; i < bolas.length; i++) {
                if (!bolas[i].ativa) continue;
                for (let j = i + 1; j < bolas.length; j++) {
                    if (!bolas[j].ativa) continue;
                    const a = bolas[i], b = bolas[j];
                    const dx = b.x - a.x, dy = b.y - a.y;
                    const dist = Math.hypot(dx, dy);
                    const distMin = RAIO_BOLA * 2;
                    if (dist < distMin && dist > 0) {
                        if (fase === 'sorteio' && !primeiraColisaoSorteio) {
                            if (a.ehBranca && !b.ehBranca) primeiraColisaoSorteio = b.numero;
                            else if (b.ehBranca && !a.ehBranca) primeiraColisaoSorteio = a.numero;
                        }

                        const nx = dx / dist, ny = dy / dist;
                        const overlap = distMin - dist;
                        a.x -= nx * overlap / 2; a.y -= ny * overlap / 2;
                        b.x += nx * overlap / 2; b.y += ny * overlap / 2;
                        const dvx = b.vx - a.vx, dvy = b.vy - a.vy;
                        const p = dvx * nx + dvy * ny;
                        if (p < 0) {
                            a.vx += p * nx; a.vy += p * ny;
                            b.vx -= p * nx; b.vy -= p * ny;
                        }
                    }
                }
            }

            const cacapas = [
                [CAÇAPA_RAIO, CAÇAPA_RAIO],
                [CANVAS_W / 2, CAÇAPA_RAIO - 4],
                [CANVAS_W - CAÇAPA_RAIO, CAÇAPA_RAIO],
                [CAÇAPA_RAIO, CANVAS_H - CAÇAPA_RAIO],
                [CANVAS_W / 2, CANVAS_H - CAÇAPA_RAIO + 4],
                [CANVAS_W - CAÇAPA_RAIO, CANVAS_H - CAÇAPA_RAIO]
            ];

            bolas.forEach(b => {
                if (!b.ativa) return;
                for (const [cx, cy] of cacapas) {
                    if (Math.hypot(b.x - cx, b.y - cy) < CAÇAPA_RAIO * 0.9) {
                        b.ativa = false;
                        b.vx = 0; b.vy = 0;
                        bolaCaiu(b);
                        break;
                    }
                }
            });

            if (estadoTacada === 'rodando' && !emMovimento) {
                estadoTacada = 'parado';

                if (fase === 'sorteio') {
                    finalizarTacadaSorteio();
                } else if (fase === 'jogo') {
                    const restantes = bolas.filter(b => b.ativa && !b.ehBranca).length;
                    if (restantes === 0) {
                        finalizarPartida();
                    } else {
                        mostrarMensagem(`Vez de ${jogadores[jogadorAtual].nome}`);
                    }
                }
            }
        }

        // ==================================================
        //   SORTEIO
        // ==================================================
        function finalizarTacadaSorteio() {
            if (jaBateuSorteio.includes(jogadorAtual)) return;
            jaBateuSorteio.push(jogadorAtual);

            if (!primeiraColisaoSorteio) {
                mostrarMensagem(`Nada foi acertado, ${jogadores[jogadorAtual].nome} tente de novo!`, 'aviso');
                return;
            }

            const grupoJ1 = GRUPO_LISO.includes(primeiraColisaoSorteio) ? 'liso' : 'listrado';

            if (jogadorAtual === 0) {
                jogadores[0].grupo = grupoJ1;
                if (jogadores.length >= 2) {
                    jogadores[1].grupo = grupoJ1 === 'liso' ? 'listrado' : 'liso';
                }
            } else {
                jogadores[1].grupo = grupoJ1;
                jogadores[0].grupo = grupoJ1 === 'liso' ? 'listrado' : 'liso';
            }

            jogadores.forEach(j => {
                j.bolas = j.grupo === 'liso' ? [...GRUPO_LISO] : [...GRUPO_LISTRADO];
            });

            if (jogadores.length === 1 || jaBateuSorteio.length >= 2) {
                iniciarJogo();
            } else {
                jogadorAtual = 1;
                primeiraColisaoSorteio = null;
                atualizarPlacar();
                mostrarMensagem(`🎱 ${jogadores[1].nome}, dê sua tacada!`, 'destaque');
            }
        }

        function iniciarJogo() {
            fase = 'jogo';
            jogadorAtual = 0;

            criarBolas();

            document.getElementById("tituloMesa").textContent = "MESA ABERTA";
            atualizarPlacar();

            const g1 = jogadores[0].grupo === 'liso' ? 'LISAS (1-7)' : 'LISTRADAS (9-15)';
            let txt = `${jogadores[0].nome} → ${g1}`;
            if (jogadores.length >= 2) {
                const g2 = jogadores[1].grupo === 'liso' ? 'LISAS (1-7)' : 'LISTRADAS (9-15)';
                txt += `   |   ${jogadores[1].nome} → ${g2}`;
            }
            mostrarMensagem(txt, 'ok');

            setTimeout(() => {
                if (fase === 'jogo') {
                    mostrarMensagem(`Vez de ${jogadores[0].nome}`, 'destaque');
                }
            }, 3500);
        }

        // ==================================================
        //   BOLA CAIU
        // ==================================================
        function bolaCaiu(bola) {
            if (bola.ehBranca) {
                if (fase === 'jogo') {
                    jogadores[jogadorAtual].pontos -= 1;
                    mostrarMensagem(`${jogadores[jogadorAtual].nome} cometeu falta (-1)`, 'aviso');
                }
                travado = true;
                setTimeout(() => {
                    bola.ativa = true;
                    bola.x = bolaBrancaOriginal.x;
                    bola.y = bolaBrancaOriginal.y;
                    bola.vx = 0; bola.vy = 0;
                    travado = false;
                }, 800);
                atualizarPlacar();
                return;
            }

            if (fase !== 'jogo') return;

            const num = bola.numero;
            const j = jogadores[jogadorAtual];

            if (j.bolas.includes(num) && !j.mortas.includes(num)) {
                j.mortas.push(num);
                j.pontos += 1;
                mostrarMensagem(`${j.nome} matou a bola ${num}! (+1)`, 'ok');
                atualizarPlacar();
            } else {
                mostrarMensagem(`Bola ${num} não é de ${j.nome}`, 'aviso');
            }
        }

        // ==================================================
        //   FINALIZAR PARTIDA
        // ==================================================
        function finalizarPartida() {
            fase = 'fim';

            let vencedor = jogadores[0];
            jogadores.forEach(j => {
                if (j.pontos > vencedor.pontos) vencedor = j;
            });

            const empatados = jogadores.filter(j => j.pontos === vencedor.pontos);
            const houveEmpate = empatados.length > 1;

            document.getElementById("finalVencedor").textContent = houveEmpate ? "EMPATE" : vencedor.nome;

            const placarDiv = document.getElementById("finalPlacar");
            placarDiv.innerHTML = "";

            jogadores.forEach(j => {
                const div = document.createElement("div");
                div.className = "final-jogador" + (!houveEmpate && j === vencedor ? " ganhador" : "");
                div.innerHTML = `
      <div class="nome">${j.nome}</div>
      <div class="pontos">${j.pontos}</div>
      <div class="legenda">PONTOS</div>
    `;
                placarDiv.appendChild(div);
            });

            atualizarPlacar();

            setTimeout(() => {
                document.getElementById("telaFinal").classList.add("ativo");
            }, 800);
        }

        // ==================================================
        //   CONTROLE DE MOUSE / TOQUE
        // ==================================================
        function pegarCoordenadas(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = CANVAS_W / rect.width;
            const scaleY = CANVAS_H / rect.height;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        // Só atualiza a posição do mouse pra mira
        canvas.addEventListener('mousemove', e => {
            const p = pegarCoordenadas(e.clientX, e.clientY);
            mouseX = p.x;
            mouseY = p.y;
            if (estadoTacada === 'parado' && !travado && fase !== 'fim') {
                estadoTacada = 'mirando';
            }
        });

        // Ao sair da mesa, cancela a mira (mas NÃO reseta o estado do jogo)
        canvas.addEventListener('mouseleave', () => {
            if (estadoTacada === 'mirando') {
                estadoTacada = 'parado';
            }
        });

        // Clique = tacada (SEM chamar mousemove junto)
        canvas.addEventListener('mousedown', e => {
            e.preventDefault();

            if (travado) return;
            if (fase === 'fim') return;
            if (estadoTacada === 'rodando') return;

            // Trava anti-duplo clique (500ms)
            const agora = Date.now();
            if (agora - ultimaTacadaTempo < 500) return;
            ultimaTacadaTempo = agora;

            // Atualiza a mira com a posição exata do clique
            const p = pegarCoordenadas(e.clientX, e.clientY);
            mouseX = p.x;
            mouseY = p.y;

            const branca = bolas.find(b => b.ehBranca && b.ativa);
            if (!branca) return;

            const dx = mouseX - branca.x;
            const dy = mouseY - branca.y;
            const dist = Math.hypot(dx, dy);
            if (dist < 1) return;

            const forca = Math.min(dist / 120, 1);
            const velocidadeMax = 18;
            branca.vx = (dx / dist) * forca * velocidadeMax;
            branca.vy = (dy / dist) * forca * velocidadeMax;

            estadoTacada = 'rodando';
            mostrarMensagem('');
        });

        // Toque (mobile)
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (travado) return;
            if (fase === 'fim') return;
            if (estadoTacada === 'rodando') return;

            const agora = Date.now();
            if (agora - ultimaTacadaTempo < 500) return;
            ultimaTacadaTempo = agora;

            const t = e.touches[0];
            const p = pegarCoordenadas(t.clientX, t.clientY);
            mouseX = p.x;
            mouseY = p.y;

            const branca = bolas.find(b => b.ehBranca && b.ativa);
            if (!branca) return;

            const dx = mouseX - branca.x;
            const dy = mouseY - branca.y;
            const dist = Math.hypot(dx, dy);
            if (dist < 1) return;

            const forca = Math.min(dist / 120, 1);
            const velocidadeMax = 18;
            branca.vx = (dx / dist) * forca * velocidadeMax;
            branca.vy = (dy / dist) * forca * velocidadeMax;

            estadoTacada = 'rodando';
            mostrarMensagem('');
        }, { passive: false });

        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            const t = e.touches[0];
            const p = pegarCoordenadas(t.clientX, t.clientY);
            mouseX = p.x;
            mouseY = p.y;
            if (estadoTacada === 'parado' && !travado && fase !== 'fim') {
                estadoTacada = 'mirando';
            }
        }, { passive: false });

        // ==================================================
        //   PLACAR
        // ==================================================
        function atualizarPlacar() {
            const cont = document.getElementById("placarTopo");
            cont.innerHTML = "";

            jogadores.forEach((j, i) => {
                const div = document.createElement("div");
                div.className = "placar-card" + (i === jogadorAtual ? " ativo" : "");

                let bolasHTML = "";
                if (j.bolas.length > 0) {
                    bolasHTML = j.bolas.map(num => {
                        const morta = j.mortas.includes(num) ? "morta" : "";
                        return `<div class="bola-mini b${num} ${morta}">${num}</div>`;
                    }).join("");
                } else {
                    for (let k = 0; k < 7; k++) {
                        bolasHTML += `<div class="bola-mini vazio"></div>`;
                    }
                }

                let grupoTxt = "";
                if (j.grupo === 'liso') grupoTxt = " • LISAS";
                else if (j.grupo === 'listrado') grupoTxt = " • LISTRADAS";

                div.innerHTML = `
      <div class="placar-info">
        <div class="placar-nome">${j.nome}${grupoTxt}</div>
        <div class="placar-pontos-linha">
          <span class="label">PONTOS</span>
          <span class="valor">${j.pontos}</span>
        </div>
      </div>
      <div class="placar-bolas">${bolasHTML}</div>
    `;
                cont.appendChild(div);
            });
        }

        // ==================================================
        //   MENSAGEM
        // ==================================================
        let msgTimer = null;
        function mostrarMensagem(txt, tipo = '') {
            const el = document.getElementById("mensagem");
            el.textContent = txt;
            el.className = "mensagem " + tipo;
            if (msgTimer) clearTimeout(msgTimer);
            if (tipo === 'aviso' || tipo === 'ok') {
                msgTimer = setTimeout(() => { el.textContent = ''; }, 2500);
            }
        }

        // ==================================================
        //   LOOP
        // ==================================================
        function loop() {
            atualizarFisica();
            desenhar();
            requestAnimationFrame(loop);
        }

        criarBolas();
        loop();
    </script>

</body>
